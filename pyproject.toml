[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py"]
extend-exclude = [".venv", "output", "media"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["renderer", "tools", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
