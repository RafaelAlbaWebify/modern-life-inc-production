name: MLI-001 full render smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mli001-render-smoke.yml'
      - 'renderer/render_episode.py'
      - 'episodes/MLI-001/production_manifest.json'
      - 'episodes/MLI-001/visual_plan.json'

jobs:
  full-render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate manifest modes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e = Path("episodes/MLI-001")
          manifest = json.loads((e/"production_manifest.json").read_text())
          plan = json.loads((e/"visual_plan.json").read_text())
          scenes = manifest["scenes"]
          assert len(scenes) == len(plan["modes"]) == 56
          assert all(s["visual_mode"] == plan["modes"][s["id"]] for s in scenes)
          assert all(("base_image" in s) == (s["visual_mode"] != "SYSTEM") for s in scenes)
          print("56 scenes and all classifications verified")
          PY
      - name: Verify all HYBRID overlay compositions
        run: |
          python - <<'PY'
          import tempfile, json
          from pathlib import Path
          from PIL import Image, ImageChops
          from renderer.render_episode import render_scene
          with tempfile.TemporaryDirectory() as tmp:
              root=Path(tmp)
              manifest=json.loads(Path("episodes/MLI-001/production_manifest.json").read_text())
              hybrid=[scene for scene in manifest["scenes"] if scene["visual_mode"]=="HYBRID"]
              assert len(hybrid)==22
              for scene in hybrid:
                  sid=scene["id"]
                  base=root/(sid+".png")
                  Image.new("RGB",(1920,1080),(65,65,65)).save(base)
                  out=root/(sid+"_out.png")
                  render_scene({**scene, "base_image":base.name},root,out,False)
                  with Image.open(out) as im:
                      assert im.size==(1920,1080)
                      assert ImageChops.difference(im.convert("RGB"),Image.new("RGB",im.size,(65,65,65))).getbbox()
                  print("PASS HYBRID overlay",sid)
          PY
      - name: Render complete video with placeholders, no narration
        run: |
          python renderer/render_episode.py --episode episodes/MLI-001 --allow-placeholders --output output/rough_cut_visual_smoke.mp4
      - name: Verify MP4 video and duration
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path("episodes/MLI-001/production_manifest.json").read_text())
          expected=sum(float(x["duration_sec"]) for x in m["scenes"])
          p="episodes/MLI-001/output/rough_cut_visual_smoke.mp4"
          d=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_format","-show_streams","-of","json",p]))
          v=[s for s in d["streams"] if s["codec_type"]=="video"]
          actual=float(d["format"]["duration"])
          assert len(v)==1, f"Expected one video stream, got {len(v)}"
          assert int(v[0]["width"])==1920 and int(v[0]["height"])==1080
          assert abs(actual-expected)<0.5, f"Duration mismatch {actual} vs {expected}"
          print(f"PASS: {len(m['scenes'])} scenes, {actual:.3f}s, 1920x1080")
          PY
      - name: Generate synthetic narration for mux smoke test
        run: |
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "sine=frequency=440:sample_rate=24000:duration=20" -ac 1 -c:a pcm_s16le /tmp/mli001_synthetic_voice.wav
      - name: Render three scenes with audio via production renderer
        run: |
          python renderer/render_episode.py --episode episodes/MLI-001 --limit 3 --allow-placeholders --audio /tmp/mli001_synthetic_voice.wav --output output/rough_cut_audio_smoke.mp4
      - name: Verify audio mux and timing
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          m=json.loads(Path("episodes/MLI-001/production_manifest.json").read_text())
          expected=sum(float(s["duration_sec"]) for s in m["scenes"][:3])
          path="episodes/MLI-001/output/rough_cut_audio_smoke.mp4"
          p=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_format","-show_streams","-of","json",path]))
          streams=p["streams"]
          video=[s for s in streams if s["codec_type"]=="video"]
          audio=[s for s in streams if s["codec_type"]=="audio"]
          duration=float(p["format"]["duration"])
          assert len(video)==1 and len(audio)==1, (video,audio)
          assert audio[0]["codec_name"]=="aac", audio[0]
          assert abs(duration-expected)<0.5, (duration,expected)
          print(f"PASS audio mux: {duration:.3f}s, video and AAC audio streams")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mli001-rough-cut-smoke
          path: |
            episodes/MLI-001/output/rough_cut_visual_smoke.mp4
            episodes/MLI-001/output/rough_cut_audio_smoke.mp4
          retention-days: 3
          if-no-files-found: ignore
