name: Repository preflight

on:
  push:
    branches:
      - feature/**
  pull_request:

permissions:
  contents: write

jobs:
  normalize-format:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install ruff
      - name: Normalize existing Python format in feature branch
        run: |
          python -m ruff format .
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- '*.py'
            git commit -m 'Normalize Python formatting for mandatory preflight'
            git push origin HEAD:${{ github.ref_name }}
          fi
  python-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and preflight tools
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff pyright pytest
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format check
        run: python -m ruff format --check .
      - name: Pyright
        run: python -m pyright
      - name: pytest
        run: python -m pytest -q
